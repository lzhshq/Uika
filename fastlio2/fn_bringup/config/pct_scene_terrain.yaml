pct_planner:
  ros__parameters:
    pcd_file_path_: "package://fast_lio/PCD/scene_terrain_map_lowbar_highwall_passable.pcd"
    forbidden_pcd_file_path_: "package://fast_lio/PCD/scene_terrain_forbidden.pcd"
    tomography_visualize_: true
    path_smoothing_enabled: false

    # Scene terrain PCT parameters. These are for the MuJoCo XML-derived map,
    # whose floor is around z=0.0.
    resolution: 0.05
    ground_h: 0.0
    slice_dh: 0.05
    interval_min: 0.05
    slope_max: 0.523599
    slope_cost_ratio: 10.0
    max_step_height: 0.15
    cost_barrier: 50.0
    safe_margin: 0.05
    inflation: 0.00
    kernal_size: 1

    a_star_cost_threshold: 20.0
    step_cost_weight: 0.2
