controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    odom_topic: /dryrun_odom
    failure_tolerance: 120.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.001
      movement_time_allowance: 120.0

    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.35

    FollowPath:
      plugin: nav2_mppi_controller::MPPIController

      transform_tolerance: 0.2
      motion_model: DiffDrive
      vx_max: 0.45
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 1.0
      ax_max: 1.0
      ax_min: -1.0
      ay_max: 0.0
      ay_min: 0.0
      az_max: 2.0

      time_steps: 56
      model_dt: 0.05
      iteration_count: 1
      batch_size: 3500
      vx_std: 0.14
      vy_std: 0.0
      wz_std: 0.45
      temperature: 0.3
      gamma: 0.015
      reset_period: 1.0
      regenerate_noises: false
      prune_distance: 1.2

      visualize: false
      TrajectoryVisualizer:
        trajectory_step: 6
        time_step: 4

      critics:
        - ConstraintCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
        - PreferForwardCritic
        - VelocityDeadbandCritic

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: false
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      GoalAngleCritic:
        enabled: false
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 80.0
        max_path_occupancy_ratio: 1.0
        trajectory_point_step: 2
        threshold_to_consider: 0.15
        offset_from_furthest: 5
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 140.0
        offset_from_furthest: 5
        threshold_to_consider: 0.15
      PathAngleCritic:
        enabled: false
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 0.15
        max_angle_to_furthest: 1.2
        mode: 0
      PreferForwardCritic:
        enabled: false
        cost_power: 1
        cost_weight: 2.0
        threshold_to_consider: 0.35
      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        deadband_velocities: [0.03, 0.0, 0.02]

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.2
      initial_transform_timeout: 30.0
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      update_frequency: 5.0
      publish_frequency: 2.0
      always_send_full_costmap: true
      track_unknown_space: false
      footprint: "[ [0.18, 0.13], [0.18, -0.13], [-0.18, -0.13], [-0.18, 0.13] ]"
      footprint_padding: 0.02
      plugins: [inflation_layer]
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 4.0
        inflation_radius: 0.15
        inflate_unknown: false
        inflate_around_unknown: false

local_costmap_client:
  ros__parameters:
    use_sim_time: false

local_costmap_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.45, 0.0, 1.0]
    min_velocity: [0.0, 0.0, -1.0]
    max_accel: [0.7, 0.0, 2.0]
    max_decel: [-0.7, 0.0, -2.0]
    odom_topic: /dryrun_odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5
